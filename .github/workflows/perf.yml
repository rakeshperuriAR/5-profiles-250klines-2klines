name: "CodeScan job 001 - profiles-5-run"

permissions:
  contents: read
  security-events: write
  actions: read

env:
  SONAR_SCANNER_VERSION: "5.0.1.3006"

on:
  push:
    branches:
      - "*"
    paths-ignore:
      - "src/test/java/**"
      - "target/**"
  pull_request:
    branches:
      - "*"
    paths-ignore:
      - "src/test/java/**"
      - "target/**"

jobs:
  build:
    runs-on: "macos-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache files
        uses: actions/cache@v4
        with:
          path: ~/.sonar
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Run CodeScan On Push
        if: github.event_name == 'push'
        uses: codescan-io/codescan-scanner-action@cd9694sarif1
        with:
          scanChangedFilesOnly: true
          organization: "va-performance-githubactions"
          projectKey: "profiles-5-run"
          codeScanUrl: "https://perf.codescan.io/"
          login: squ_0eee50e6c310def43a7e8ac38d186557da7f0df4
          generateSarifFile: true

      - name: Run CodeScan On PR
        if: github.event_name == 'pull_request'
        uses: codescan-io/codescan-scanner-action@cd9694sarif1
        with:
          scanChangedFilesOnly: true
          organization: "va-performance-githubactions"
          projectKey: "profiles-5-run"
          codeScanUrl: "https://perf.codescan.io/"
          login: squ_0eee50e6c310def43a7e8ac38d186557da7f0df4
          generateSarifFile: true
          args: |
            sonar.pullrequest.branch=${{ github.head_ref }}
            sonar.pullrequest.base=${{ github.base_ref }}
            sonar.pullrequest.key=${{ github.event.number }}

      - name: Verify SARIF file
        run: |
          echo "Checking SARIF file..."
          pwd
          ls -la
          ls -lh codescan.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codescan.sarif
          wait-for-processing: true

      - name: Archive CodeScan SARIF results
        uses: actions/upload-artifact@v4
        with:
          name: codescan-sarif
          path: codescan.sarif
